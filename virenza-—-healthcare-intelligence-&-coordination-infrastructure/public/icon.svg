<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#FBFBF7"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#E7E4DC" stroke-width="8"/>
  <g transform="translate(256, 256)">
    <!-- Interconnected network grid rings -->
    <circle r="160" fill="none" stroke="#D9EBDE" stroke-width="4" stroke-dasharray="8 8"/>
    <circle r="100" fill="none" stroke="#DDE8F0" stroke-width="4"/>
    
    <!-- Central Medical Cross with precise geometry -->
    <rect x="-24" y="-80" width="48" height="160" rx="12" fill="#3C7049"/>
    <rect x="-80" y="-24" width="160" height="48" rx="12" fill="#3C7049"/>
    
    <!-- Central Intelligence Core -->
    <circle r="20" fill="#FBFBF7" stroke="#22241F" stroke-width="6"/>
    <circle r="8" fill="#3C7049"/>

    <!-- Coordinate Intelligence Nodes -->
    <g fill="#3E6B8E" stroke="#FBFBF7" stroke-width="4">
      <circle cx="0" cy="-160" r="14"/>
      <circle cx="160" cy="0" r="14"/>
      <circle cx="0" cy="160" r="14"/>
      <circle cx="-160" cy="0" r="14"/>
      <circle cx="113" cy="-113" r="10" fill="#B8822E"/>
      <circle cx="-113" cy="113" r="10" fill="#B8822E"/>
    </g>
  </g>
</svg>
