    <!-- Polyfill to allow safe assignment to window.fetch in environments with getter-only fetch (e.g. AI Studio preview / extensions) -->
    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set && desc.configurable) {
            var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _nativeFetch;
              },
              set: function(fn) {
                _nativeFetch = fn;
              },
              enumerable: desc.enumerable !== undefined ? desc.enumerable : true,
              configurable: true
            });
          }
        } catch (e) {
          console.warn('Could not define fetch setter on Window.prototype', e);
        }
      })();
    </script>
